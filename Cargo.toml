[package]
name = "email-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "MCP server for reading, writing, sending and organizing email across multiple IMAP/SMTP accounts (iCloud, Gmail, others)"
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["mcp", "email", "imap", "smtp", "gmail"]
categories = ["email", "command-line-utilities"]
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

# `email-mcp` stays the root package; `email-engine` is the mail engine it
# drives (accounts, credentials, IMAP, SMTP, composing), usable without MCP.
[workspace]
members = ["email-engine"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jfernand/email-mcp"

[dependencies]
anyhow = "1.0.104"
email-engine = { path = "email-engine", version = "0.1.0", features = ["schema"] }
rmcp = { version = "3.6.0", features = ["server", "transport-io", "macros"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
